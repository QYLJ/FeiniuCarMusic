plugins {
    id "com.android.application"
}

android {
    namespace "com.feiniu.carmusic"
    compileSdk 35

    defaultConfig {
        applicationId "com.feiniu.carmusic"
        minSdk 14
        targetSdk 35
        versionCode 21
        versionName "0.3.14-streaming"
    }

    buildTypes {
        release {
            minifyEnabled false
            proguardFiles getDefaultProguardFile("proguard-android-optimize.txt"), "proguard-rules.pro"
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_1_8
        targetCompatibility JavaVersion.VERSION_1_8
    }

    testOptions {
        unitTests.includeAndroidResources = true
        unitTests.all {
            systemProperty "robolectric.dependency.repo.url", "https://repo.maven.apache.org/maven2"
            systemProperty "feiniu.liveUpdates", project.findProperty("liveUpdateTest") == "true"
        }
    }

    lint {
        abortOnError false
        checkReleaseBuilds false
        disable "ExpiredTargetSdkVersion"
    }
}

dependencies {
    implementation files("libs/conscrypt-android-2.5.3.aar")
    testImplementation "junit:junit:4.13.2"
    testImplementation "org.robolectric:robolectric:4.14.1"
    testImplementation "com.squareup.okhttp3:mockwebserver:3.14.9"
}
